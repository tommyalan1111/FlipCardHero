plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flipcardhero.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.flipcardhero.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Zero extra external dependencies needed for standard hardware-accelerated WebView
}
