plugins {
    id 'com.android.application'
}

// Chỉ áp dụng Google Services khi đã có file cấu hình Firebase.
// Nhờ vậy project vẫn build được khi chưa tạo Firebase project.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.flipcardhero.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.flipcardhero.game"
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName "1.0.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        // Ép dùng annotation đồng nhất để tránh xung đột sau khi resolve
        if (details.requested.group == 'androidx.annotation' && details.requested.name == 'annotation') {
            details.useVersion '1.9.1'
        }
    }
}

dependencies {
    // Google Mobile Ads (AdMob)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // Firebase Auth (Anonymous) + Cloud Firestore cho leaderboard
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
