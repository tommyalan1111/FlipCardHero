<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100%" height="100%">
  <defs>
    <linearGradient id="cBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="cGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="96" height="136" rx="8" fill="url(#cBackGrad)" stroke="url(#cGoldGrad)" stroke-width="4"/>
  <rect x="8" y="8" width="84" height="124" rx="6" fill="#450a0a" opacity="0.6"/>

  <!-- Ornate Corner Accents -->
  <polygon points="12,12 24,12 12,24" fill="url(#cGoldGrad)"/>
  <polygon points="88,12 76,12 88,24" fill="url(#cGoldGrad)"/>
  <polygon points="12,128 24,128 12,116" fill="url(#cGoldGrad)"/>
  <polygon points="88,128 76,128 88,116" fill="url(#cGoldGrad)"/>

  <!-- Center Crest -->
  <circle cx="50" cy="70" r="28" fill="#18181b" stroke="url(#cGoldGrad)" stroke-width="3"/>
  <!-- Fiery Dragon/Hero Star -->
  <polygon points="50,50 54,64 68,65 57,74 61,88 50,79 39,88 43,74 32,65 46,64" fill="url(#cGoldGrad)"/>
  <circle cx="50" cy="70" r="6" fill="#ef4444"/>
</svg>
