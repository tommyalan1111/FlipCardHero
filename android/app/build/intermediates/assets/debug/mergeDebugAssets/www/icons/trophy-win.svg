<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glow background -->
  <circle cx="100" cy="100" r="90" fill="url(#sunburst)"/>

  <!-- Handles -->
  <path d="M50,60 C25,60 25,105 55,115" stroke="url(#goldCup)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M150,60 C175,60 175,105 145,115" stroke="url(#goldCup)" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Cup Body -->
  <path d="M50,45 L150,45 C150,95 130,130 100,130 C70,130 50,95 50,45 Z" fill="url(#goldCup)" stroke="#a16207" stroke-width="3"/>
  <!-- Cup Rim -->
  <ellipse cx="100" cy="45" rx="50" ry="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>

  <!-- Star Emblem on Cup -->
  <polygon points="100,65 105,78 118,79 108,88 111,101 100,94 89,101 92,88 82,79 95,78" fill="#ffffff" stroke="#eab308" stroke-width="2"/>

  <!-- Stem & Base -->
  <rect x="92" y="130" width="16" height="24" fill="url(#goldCup)" stroke="#a16207" stroke-width="2"/>
  <path d="M65,154 L135,154 L145,175 L55,175 Z" fill="url(#goldCup)" stroke="#a16207" stroke-width="2"/>
  <rect x="50" y="175" width="100" height="12" rx="4" fill="#854d0e"/>

  <!-- Sparkles -->
  <polygon points="40,30 43,38 50,40 43,42 40,50 37,42 30,40 37,38" fill="#ffffff"/>
  <polygon points="160,35 162,41 168,43 162,45 160,51 158,45 152,43 158,41" fill="#ffffff"/>
</svg>
