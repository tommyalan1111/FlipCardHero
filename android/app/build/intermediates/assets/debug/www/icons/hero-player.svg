<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="120" cy="140" r="100" fill="#f59e0b" opacity="0.18" filter="url(#glow)"/>

  <!-- Spiky Anime Hair (Back) -->
  <path d="M40,110 L20,70 L60,80 L60,40 L100,60 L120,20 L150,55 L190,30 L180,80 L220,75 L195,120 Z" fill="url(#hairGrad)"/>

  <!-- Face / Head -->
  <ellipse cx="120" cy="115" rx="65" ry="58" fill="url(#skinGrad)" stroke="#ea580c" stroke-width="3"/>

  <!-- Hero Headband -->
  <path d="M55,95 Q120,80 185,95 L183,115 Q120,100 57,115 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <rect x="105" y="86" width="30" height="22" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="120,89 123,96 130,97 125,102 126,108 120,105 114,108 115,102 110,97 117,96" fill="#f59e0b"/>

  <!-- Eyes (Anime Sparkle) -->
  <!-- Left Eye -->
  <ellipse cx="95" cy="125" rx="14" ry="17" fill="#1e293b"/>
  <ellipse cx="98" cy="121" rx="6" ry="8" fill="#38bdf8"/>
  <circle cx="94" cy="118" r="3.5" fill="#ffffff"/>
  <circle cx="101" cy="130" r="2" fill="#ffffff"/>
  <path d="M80,108 Q95,103 110,108" stroke="#7c2d12" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Right Eye -->
  <ellipse cx="145" cy="125" rx="14" ry="17" fill="#1e293b"/>
  <ellipse cx="148" cy="121" rx="6" ry="8" fill="#38bdf8"/>
  <circle cx="144" cy="118" r="3.5" fill="#ffffff"/>
  <circle cx="151" cy="130" r="2" fill="#ffffff"/>
  <path d="M130,108 Q145,103 160,108" stroke="#7c2d12" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Cute Blush -->
  <ellipse cx="78" cy="136" rx="8" ry="4" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="162" cy="136" rx="8" ry="4" fill="#f43f5e" opacity="0.4"/>

  <!-- Confident Grin Mouth -->
  <path d="M106,146 Q120,165 134,146 Z" fill="#991b1b" stroke="#7c2d12" stroke-width="2"/>
  <path d="M110,147 Q120,154 130,147" fill="#ffffff"/>

  <!-- Spiky Anime Hair (Front Bangs) -->
  <path d="M56,92 L75,115 L88,96 L108,122 L118,97 L142,120 L150,96 L175,116 L180,92 Z" fill="url(#hairGrad)"/>

  <!-- Body / Hero Jacket -->
  <path d="M70,170 Q120,185 170,170 L185,250 L55,250 Z" fill="url(#jacketGrad)" stroke="#1e3a8a" stroke-width="3"/>
  <!-- Shirt collar -->
  <polygon points="120,175 100,195 140,195" fill="#ffffff"/>
  <polygon points="120,195 105,250 135,250" fill="#f8fafc"/>

  <!-- Left Arm & Hand Holding Glowing Battle Card -->
  <!-- Arm -->
  <path d="M60,180 Q35,200 45,230" stroke="url(#jacketGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Glowing Card -->
  <g transform="translate(15, 175) rotate(-18)">
    <rect x="0" y="0" width="46" height="66" rx="6" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
    <rect x="4" y="4" width="38" height="58" rx="4" fill="#b45309" opacity="0.3"/>
    <circle cx="23" cy="33" r="14" fill="#fef08a"/>
    <polygon points="23,23 26,30 33,31 28,36 29,43 23,39 17,43 18,36 13,31 20,30" fill="#d97706"/>
    <!-- Card Sparkles -->
    <path d="M-6,10 L-2,12 L-6,14 L-4,12 Z" fill="#ffffff"/>
    <path d="M50,45 L54,47 L50,49 L52,47 Z" fill="#ffffff"/>
  </g>
  <!-- Hand grasping card -->
  <ellipse cx="48" cy="222" rx="14" ry="12" fill="url(#skinGrad)" stroke="#ea580c" stroke-width="2.5"/>
</svg>
