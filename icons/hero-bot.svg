<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="botGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="120" cy="140" r="100" fill="#06b6d4" opacity="0.18" filter="url(#botGlow)"/>

  <!-- Mecha Antennae / Ears -->
  <polygon points="45,95 20,60 50,75" fill="url(#goldPlate)" stroke="#ca8a04" stroke-width="2"/>
  <polygon points="195,95 220,60 190,75" fill="url(#goldPlate)" stroke="#ca8a04" stroke-width="2"/>
  <!-- Top Crest -->
  <polygon points="120,30 100,65 140,65" fill="url(#goldPlate)" stroke="#ca8a04" stroke-width="2"/>

  <!-- Robot Head Helmet -->
  <rect x="52" y="65" width="136" height="105" rx="32" fill="url(#metalGrad)" stroke="#64748b" stroke-width="4"/>
  <!-- Helmet Cheek Armor Plates -->
  <polygon points="52,130 35,155 65,165" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <polygon points="188,130 205,155 175,165" fill="#1e293b" stroke="#64748b" stroke-width="2"/>

  <!-- Visor Screen (Glowing Cyan) -->
  <rect x="68" y="90" width="104" height="46" rx="14" fill="#082f49" stroke="#0284c7" stroke-width="2"/>
  <!-- Glowing Cyber Eyes inside Visor -->
  <ellipse cx="96" cy="113" rx="14" ry="10" fill="url(#cyanGlow)" filter="url(#botGlow)"/>
  <circle cx="98" cy="110" r="4" fill="#ffffff"/>
  <ellipse cx="144" cy="113" rx="14" ry="10" fill="url(#cyanGlow)" filter="url(#botGlow)"/>
  <circle cx="146" cy="110" r="4" fill="#ffffff"/>

  <!-- Cheek Bolts / Screws -->
  <circle cx="68" cy="150" r="4" fill="#94a3b8"/>
  <circle cx="172" cy="150" r="4" fill="#94a3b8"/>

  <!-- Robot Smile Mouth (Digital LEDs) -->
  <path d="M104,152 Q120,162 136,152" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#botGlow)"/>

  <!-- Shoulders & Torso Armor -->
  <path d="M60,175 Q120,190 180,175 L195,250 L45,250 Z" fill="url(#metalGrad)" stroke="#475569" stroke-width="3"/>
  <rect x="95" y="195" width="50" height="40" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="120" cy="215" r="10" fill="url(#cyanGlow)" filter="url(#botGlow)"/>

  <!-- Right Arm & Mecha Claw holding Dark Lightning Card -->
  <!-- Arm -->
  <path d="M180,185 Q205,205 195,235" stroke="url(#metalGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Card in Hand -->
  <g transform="translate(180, 175) rotate(18)">
    <rect x="0" y="0" width="46" height="66" rx="6" fill="url(#darkCard)" stroke="#a78bfa" stroke-width="3" filter="url(#botGlow)"/>
    <rect x="4" y="4" width="38" height="58" rx="4" fill="#4c1d95" opacity="0.4"/>
    <circle cx="23" cy="33" r="14" fill="#c084fc"/>
    <!-- Lightning Bolt symbol -->
    <polygon points="26,18 16,33 24,33 20,48 30,31 22,31" fill="#facc15"/>
  </g>
  <!-- Claw grasping card -->
  <rect x="180" y="215" width="22" height="16" rx="6" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
</svg>
