<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=512, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; }

  /* Nền full-bleed cho lớp background của adaptive icon.
     Không có lá bài/burst vì phần đó nằm ở lớp foreground. */
  .icon {
    position: relative;
    width: 512px; height: 512px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 42%, #7dd3fc 0%, #38bdf8 28%, #0284c7 62%, #075985 100%);
  }

  .rays {
    position: absolute;
    inset: -40%;
    background: repeating-conic-gradient(
      from 0deg at 50% 48%,
      rgba(255, 255, 255, 0.16) 0deg 7deg,
      rgba(255, 255, 255, 0) 7deg 22deg
    );
    filter: blur(1px);
    opacity: 0.75;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 44%, rgba(2, 20, 40, 0) 42%, rgba(2, 20, 40, 0.40) 100%);
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="rays"></div>
    <div class="vignette"></div>
  </div>
</body>
</html>
